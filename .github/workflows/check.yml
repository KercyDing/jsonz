name: Format and test

on:
  push:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check src fuzzy build.zig

  check:
    name: Zig ${{ matrix.zig }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig:
          - master
          - 0.16.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Run tests
        run: zig build test
